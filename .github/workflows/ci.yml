name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  statische-analyse:
    name: Lint und Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint (mit Typinformation)
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Formatierung
        run: npm run format:check

  tests:
    name: Unit- und Integrationstests
    runs-on: ubuntu-latest

    # Kein Datenbank-Container: Die Integrationstests starten ihre eigene
    # eingebettete PostgreSQL-Instanz. Damit haengt der Lauf weder an einem
    # Docker-Daemon noch an der Verfuegbarkeit einer Container-Registry.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Tests mit Abdeckung
        run: npm run test:coverage

      - name: Integrationstests
        run: npm run test:integration

      - name: Abdeckungsbericht sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-End-Tests
    runs-on: ubuntu-latest
    needs: [statische-analyse, tests]

    # Ebenfalls ohne Datenbank-Container: Das Playwright-Setup startet eine
    # eingebettete Instanz und setzt DATABASE_URL, bevor der Webserver laeuft.
    # Bewusst auch ohne Anbieter-Schluessel — geprueft wird genau der
    # schluessellose Pfad, den auch eine fremde Person vorfindet.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests
        run: npm run test:e2e

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
